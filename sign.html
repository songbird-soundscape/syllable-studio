<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syllable Studio Sign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root { --bg: #e9ece6; --ink: #18211d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151816; --ink: #e5ece7; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #151816; --ink: #e5ece7; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Atkinson Hyperlegible", sans-serif; padding: 16px max(16px, env(safe-area-inset-left, 0px)); }
canvas { display: block; width: min(100%, 680px); height: auto; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,0.25); }
@media print { @page { size: letter; margin: 0; } body { padding: 0; background: #fff; } canvas { width: 8.5in; height: 11in; box-shadow: none; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<canvas id="sign" width="2550" height="3300" role="img" aria-label="Sign: Can you measure a birdsong? Scan the QR code to try Syllable Studio"></canvas>
<script>
(() => {
const URL_ = 'https://songbird-soundscape.github.io/syllable-studio/';
const c = document.getElementById('sign'), g = c.getContext('2d'), W = c.width, H = c.height;
const px = (x, y, col, s, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y, w * s, h * s); };
function draw() {
  g.fillStyle = '#f6f3ea'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#1c7ed6'; g.fillRect(0, 0, W, 90); g.fillRect(0, H - 90, W, 90);
  g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = '#18211d';
  g.font = '700 170px Silkscreen'; g.fillText('CAN YOU', W / 2, 330); g.fillText('MEASURE A', W / 2, 520);
  g.fillStyle = '#1c7ed6'; g.fillText('BIRDSONG?', W / 2, 710);
  // a singing pixel bird and its song as a little spectrogram
  const s = 22, bx = 330, by = 830, B = '#d42a2a', D = '#9a1e1e';
  px(bx - 2 * s, by + s, D, s, 2, 1); px(bx, by, B, s, 4, 3); px(bx + s, by + s, D, s, 2, 1); px(bx + 3 * s, by - s, B, s, 2, 2); px(bx + 4 * s, by - s, '#111', s); px(bx + 5 * s, by, '#e8a33c', s);
  px(bx + s, by + 3 * s, '#3a2a1a', s); px(bx + 3 * s, by + 3 * s, '#3a2a1a', s);
  g.strokeStyle = '#18211d'; g.lineWidth = 16; g.lineCap = 'round';
  const strokes = [[560, 800, 680, 900], [720, 800, 840, 900], [880, 800, 1000, 900], [1060, 900, 1130, 820], [1170, 900, 1240, 820], [1280, 900, 1350, 820], [1390, 900, 1460, 820]];
  strokes.forEach(([a, b, c2, d]) => { g.beginPath(); g.moveTo(a, b); g.lineTo(c2, d); g.stroke(); });
  g.strokeStyle = '#e8590c'; g.lineWidth = 10; g.setLineDash([26, 16]); g.strokeRect(1500, 780, 420, 150); g.setLineDash([]);
  g.fillStyle = '#e8590c'; g.font = '700 46px Silkscreen'; g.textAlign = 'left'; g.fillText('BOX IT!', 1960, 880); g.textAlign = 'center';
  for (let k = 0; k < 9; k++) { g.fillStyle = '#18211d'; g.fillRect(1530 + k * 42, 830 + (k % 2) * 22, 22, 46); }
  // the QR code
  const qr = qrcode(0, 'M'); qr.addData(URL_); qr.make(); const n = qr.getModuleCount(), size = 1360, cell = Math.floor(size / (n + 8)), qs = cell * (n + 8), qx = (W - qs) / 2, qy = 1010;
  g.fillStyle = '#ffffff'; g.fillRect(qx, qy, qs, qs); g.strokeStyle = '#18211d'; g.lineWidth = 8; g.strokeRect(qx, qy, qs, qs);
  g.fillStyle = '#18211d'; for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (qr.isDark(r, col)) g.fillRect(qx + (col + 4) * cell, qy + (r + 4) * cell, cell, cell);
  const below = qy + qs;
  g.font = '700 92px "Atkinson Hyperlegible", sans-serif'; g.fillStyle = '#18211d'; g.fillText('Scan, then drag a box around each syllable.', W / 2, below + 150);
  g.font = '400 70px "Atkinson Hyperlegible", sans-serif'; g.fillStyle = '#3a4a42'; g.fillText('2 minutes  ·  phones welcome  ·  see how close you get', W / 2, below + 260);
  g.font = '700 62px "Atkinson Hyperlegible", sans-serif'; g.fillStyle = '#1c7ed6'; g.fillText('songbird-soundscape.github.io/syllable-studio', W / 2, below + 370);
  g.fillStyle = '#e6efe3'; g.fillRect(170, below + 450, W - 340, 360); g.fillStyle = '#2b8a3e'; g.fillRect(170, below + 450, 22, 360);
  g.textAlign = 'left'; g.fillStyle = '#18211d'; g.font = '700 70px Silkscreen'; g.fillText('JOIN THE FIELD CIRCLE', 250, below + 560);
  g.font = '400 60px "Atkinson Hyperlegible", sans-serif'; g.fillText('Stay tuned for sound-processing jobs, and meet', 250, below + 660); g.fillText('field ecologists young and seasoned, sharing what they know.', 250, below + 740);
  g.textAlign = 'center';
}
document.fonts.ready.then(draw); draw();
window.signPNG = () => c.toDataURL('image/png');
})();
</script>
</body>
</html>
